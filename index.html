<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="One useful idea at a time — swipe, play, and try it today.">
<title>Daily Insight</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Insight">
<meta name="theme-color" content="#090b11">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090b11'/%3E%3Cpath d='M18 42V22h11c10 0 17 3 17 10s-7 10-17 10H18Zm8-6h4c5 0 8-1 8-4s-3-4-8-4h-4v8Z' fill='%23f2bd49'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b11; --panel:#121620; --panel-2:#171c28;
  --ink:#f5f3eb; --dim:#a5abba; --faint:#737b8e;
  --gold:#f2bd49; --coral:#ff786c; --teal:#5ed8c7; --violet:#aa91ff;
  --line:rgba(255,255,255,.11); --shadow:0 24px 80px rgba(0,0,0,.45);
  --ease:cubic-bezier(.22,.8,.25,1);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(circle at 12% 12%,rgba(94,216,199,.11),transparent 30%),
  radial-gradient(circle at 88% 78%,rgba(170,145,255,.1),transparent 32%),
  var(--bg)}
.topbar{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;background:linear-gradient(180deg,rgba(9,11,17,.96) 0%,rgba(9,11,17,.78) 68%,transparent 100%);pointer-events:none}
.toprow{height:42px;max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:auto}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--gold)}
.topactions{display:flex;align-items:center;gap:7px}
.iconbtn,.pillbtn,.copybtn,.navbtn{border:1px solid var(--line);color:var(--ink);background:rgba(18,22,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;transition:transform .2s var(--ease),background .2s,border-color .2s}
.iconbtn:hover,.pillbtn:hover,.copybtn:hover,.navbtn:hover{background:#202634;border-color:rgba(255,255,255,.2)}
.iconbtn:active,.pillbtn:active,.copybtn:active,.navbtn:active{transform:scale(.96)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{color:#11151e;background:var(--gold);border-color:var(--gold)}
.pillbtn{height:38px;border-radius:99px;padding:0 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.pillbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.progress{max-width:980px;margin:8px auto 0;display:flex;gap:4px;height:3px;pointer-events:auto}
.progress span{flex:1;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.progress span::after{content:"";display:block;height:100%;width:0;background:var(--ink);transition:width .25s var(--ease)}
.progress span.done::after,.progress span.active::after{width:100%}
.progress span.active::after{background:var(--gold)}
#feed{min-height:100svh}
.story{position:relative;min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 82px) 18px calc(env(safe-area-inset-bottom) + 40px);isolation:isolate;overflow:hidden}
.story::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.9}
.story[data-kind="hook"]::before{background:radial-gradient(circle at 50% 20%,rgba(242,189,73,.15),transparent 42%),linear-gradient(165deg,#12141d 0%,#090b11 70%)}
.story[data-kind="insight"]::before{background:radial-gradient(circle at 12% 68%,rgba(94,216,199,.13),transparent 36%),linear-gradient(150deg,#0d1518 0%,#090b11 65%)}
.story[data-kind="visual"]::before{background:radial-gradient(circle at 88% 15%,rgba(170,145,255,.14),transparent 34%),linear-gradient(155deg,#12111a 0%,#090b11 70%)}
.story[data-kind="lab"]::before{background:radial-gradient(circle at 8% 18%,rgba(170,145,255,.15),transparent 32%),linear-gradient(145deg,#11101b 0%,#090b11 72%)}
.story[data-kind="steal"]::before{background:radial-gradient(circle at 85% 75%,rgba(255,120,108,.14),transparent 36%),linear-gradient(145deg,#18120f 0%,#090b11 70%)}
.story[data-kind="video"]::before{background:radial-gradient(circle at 50% 60%,rgba(255,120,108,.12),transparent 42%),#090b11}
.story[data-kind="shortvideo"]::before{background:radial-gradient(circle at 50% 45%,rgba(242,189,73,.14),transparent 45%),#090b11}
.story[data-kind="interactive"]::before{background:radial-gradient(circle at 50% 42%,rgba(94,216,199,.13),transparent 46%),#090b11}
.storycard{width:min(100%,780px);position:relative}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent,var(--gold));display:flex;align-items:center;gap:9px;margin:0 0 18px}
.eyebrow::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 18px currentColor}
.hookcard{text-align:center;max-width:840px}
.hookcard .date{color:var(--dim);font-size:.84rem;font-weight:600;margin-bottom:18px}
.hookcard h1{font-family:'Fraunces',serif;font-size:clamp(2.75rem,8.5vw,6.6rem);font-weight:600;line-height:.98;letter-spacing:-.055em;margin:0 auto;max-width:13ch;text-wrap:balance}
.hookcard .model{font-family:'Fraunces',serif;color:var(--gold);font-size:clamp(1.15rem,3vw,1.5rem);margin:26px auto 0}
.hookcard .editioncount{margin-top:10px;color:var(--faint);font-size:.82rem}
.swipehint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;animation:float 2.3s ease-in-out infinite}
.swipehint svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}
@keyframes float{50%{transform:translate(-50%,-7px)}}
.story h2{font-family:'Fraunces',serif;font-size:clamp(2rem,5.4vw,4.25rem);line-height:1.03;letter-spacing:-.045em;margin:0 0 25px;text-wrap:balance}
.story p{font-size:clamp(1.04rem,2.2vw,1.3rem);line-height:1.55;color:var(--dim);margin:0 0 16px;max-width:68ch}
.story p strong{color:var(--ink);font-weight:600}.story p em{color:var(--ink)}
.after{border-left:2px solid var(--teal);padding-left:18px;margin-top:24px}
.after p{color:var(--ink);font-size:clamp(.98rem,2vw,1.14rem)}
.visualframe{background:rgba(20,24,36,.72);border:1px solid var(--line);border-radius:28px;padding:clamp(14px,3vw,28px);box-shadow:var(--shadow);overflow:hidden}
.visualframe svg{display:block;width:100%;height:auto;max-height:50svh}
.caption{font-size:.85rem;color:var(--faint);text-align:center;margin:15px auto 0;max-width:52ch}
.labbox{background:linear-gradient(145deg,rgba(170,145,255,.12),rgba(94,216,199,.07));border:1px solid rgba(170,145,255,.3);border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:var(--shadow)}
.label{font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--violet);margin-bottom:12px}
.labbox p.exercise{font-family:'Fraunces',serif;color:var(--ink);font-size:clamp(1.2rem,2.8vw,1.65rem);line-height:1.42;margin:0}
.stealline{font-family:'Fraunces',serif;font-size:clamp(2.2rem,6.5vw,5.2rem);line-height:1.05;letter-spacing:-.045em;color:var(--gold);max-width:16ch;margin:0 0 30px;text-wrap:balance}
.example{margin-top:23px;padding:18px 20px;border-radius:18px;background:rgba(242,189,73,.08);border:1px solid rgba(242,189,73,.2)}
.example p{font-style:italic;color:var(--ink);font-size:clamp(.96rem,2vw,1.08rem);margin:0}
.copybtn{margin-top:22px;border-radius:99px;padding:10px 16px;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:8px}
.copybtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.video{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:16/9;border:1px solid var(--line);box-shadow:var(--shadow);margin:18px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shortvideo-frame{width:min(100%,430px);margin:0 auto;border-radius:27px;overflow:hidden;background:#050608;border:1px solid rgba(255,255,255,.15);box-shadow:0 28px 90px rgba(0,0,0,.6)}
.shortvideo{display:block;width:100%;height:auto;max-height:76svh;background:#050608;object-fit:contain}
.shortvideo-meta{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;color:var(--dim);font-size:.78rem;font-weight:600}
.shortvideo-meta span:first-child{color:var(--gold)}
.episode-wrap{width:min(100%,430px,42.75svh);margin:0 auto}
.episode{position:relative;width:100%;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#f3ead6;color:#12151b;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 95px rgba(0,0,0,.6);isolation:isolate}
.episode::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);border-radius:inherit;z-index:10}
.episode-sky{position:absolute;inset:0;background:linear-gradient(180deg,#f6efd9 0%,#d9eee7 62%,#c9ddcf 62% 100%)}
.episode-sun{position:absolute;left:12%;top:9%;width:68px;height:68px;border-radius:50%;background:#f2bd49;box-shadow:0 0 0 14px rgba(242,189,73,.13);animation:episodeBreathe 4s ease-in-out infinite}
.episode svg{position:absolute;inset:9% 0 18%;width:100%;height:73%;overflow:visible}
.episode .sketch{fill:none;stroke:#172029;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.episode .soft{fill:#fffaf0;stroke:#172029;stroke-width:3;vector-effect:non-scaling-stroke}
.episode .gold{fill:#f2bd49}.episode .teal{fill:#5ed8c7}.episode .coral{fill:#ff786c}.episode .ink{fill:#172029}
.episode-brand{position:absolute;left:18px;top:16px;z-index:8;font-family:'Fraunces',serif;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:#172029}
.episode-controls{position:absolute;right:13px;top:12px;z-index:12;display:flex;gap:7px}
.episode-control{width:34px;height:34px;border:1px solid rgba(23,32,41,.16);border-radius:50%;background:rgba(255,250,240,.8);color:#172029;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.episode-control svg{position:static;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.episode-caption{position:absolute;z-index:9;left:7%;right:7%;bottom:5.5%;min-height:68px;display:grid;place-items:center;text-align:center;background:#fffaf0;border:2px solid #172029;border-radius:14px;padding:11px 14px;font-size:clamp(.88rem,3.8vw,1.04rem);font-weight:800;line-height:1.2;box-shadow:6px 6px 0 #172029}
.episode-progress{position:absolute;z-index:12;left:5%;right:5%;top:5.4%;height:4px;background:rgba(23,32,41,.16);border-radius:99px;overflow:hidden}
.episode-progress span{display:block;width:0;height:100%;background:#172029;transition:width .45s var(--ease)}
.episode-choice{position:absolute;z-index:14;left:7%;right:7%;bottom:20%;display:grid;gap:9px;opacity:0;visibility:hidden;transform:translateY(15px);pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease),visibility 0s .35s}
.episode-choice.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.episode-choice p{justify-self:center;width:max-content;max-width:100%;margin:0 0 2px!important;text-align:center;color:#172029!important;background:rgba(255,250,240,.92);border:2px solid #172029;border-radius:99px;padding:5px 11px;font-size:.82rem!important;font-weight:800}
.episode-choice button{border:2px solid #172029;border-radius:14px;background:#fffaf0;color:#172029;box-shadow:4px 4px 0 #172029;padding:11px 12px;font-size:.83rem;font-weight:800;cursor:pointer;transition:.18s var(--ease)}
.episode-choice button:last-child{background:#f2bd49}.episode-choice button:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 #172029}.episode-choice button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #172029}
.episode-status{text-align:center;color:var(--dim);font-size:.76rem;font-weight:650;margin-top:12px}
.episode .person{transform-box:fill-box;transform-origin:center bottom}
.episode .person-a{animation:episodeBob 1.7s ease-in-out infinite}
.episode .person-b{animation:episodeBob 1.7s .25s ease-in-out infinite}
.episode .eyebrow{animation:episodeBlink 4.2s infinite}
.episode .mess-card{transform-box:fill-box;transform-origin:center;animation:episodeFloat 2.6s ease-in-out infinite}
.episode .mess-card:nth-child(2){animation-delay:-.7s}.episode .mess-card:nth-child(3){animation-delay:-1.3s}.episode .mess-card:nth-child(4){animation-delay:-1.9s}
.episode .confusion{transform-box:fill-box;transform-origin:center;animation:episodeWobble 1.1s ease-in-out infinite}
.episode .timeline{opacity:0;transition:.5s var(--ease)}
.episode .timeline-path{stroke-dasharray:530;stroke-dashoffset:530}
.episode.stage-choice .person-b{animation:episodeShrug 1.2s ease-in-out infinite}
.episode.stage-wrong .mess-card{animation:episodeScatter .7s var(--ease) both}
.episode.stage-wrong .mess-card:nth-child(2){animation-delay:.08s}.episode.stage-wrong .mess-card:nth-child(3){animation-delay:.16s}.episode.stage-wrong .mess-card:nth-child(4){animation-delay:.24s}
.episode.stage-right .mess{opacity:0;transform:scale(.7);transform-origin:center;transition:.45s var(--ease)}
.episode.stage-right .confusion{opacity:0;transition:.3s}
.episode .listener-smile{opacity:0}.episode.stage-right .listener-frown{opacity:0}.episode.stage-right .listener-smile{opacity:1}
.episode.stage-right .timeline{opacity:1}
.episode.stage-right .timeline-path{animation:episodeDraw 1.1s .25s var(--ease) forwards}
.episode.stage-right .beat{transform-box:fill-box;transform-origin:center;animation:episodePop .42s both}
.episode.stage-right .beat:nth-of-type(2){animation-delay:.5s}.episode.stage-right .beat:nth-of-type(3){animation-delay:.9s}.episode.stage-right .beat:nth-of-type(4){animation-delay:1.3s}
.episode.stage-right .person-a{animation:episodeWalk 2.4s .2s var(--ease) both}
.episode.stage-right .person-b{animation:episodeNod .7s 1.6s ease-in-out 3}
@keyframes episodeBreathe{50%{transform:scale(1.08)}}
@keyframes episodeBob{50%{transform:translateY(-4px)}}
@keyframes episodeBlink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes episodeFloat{50%{transform:translate(0,-8px) rotate(2deg)}}
@keyframes episodeWobble{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes episodeShrug{50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes episodeScatter{to{transform:translate(var(--scatter-x),var(--scatter-y)) rotate(var(--scatter-r));opacity:.26}}
@keyframes episodeDraw{to{stroke-dashoffset:0}}
@keyframes episodePop{0%{transform:scale(0)}75%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes episodeWalk{0%{transform:translateX(0)}35%{transform:translateX(62px) rotate(2deg)}70%,100%{transform:translateX(124px)}}
@keyframes episodeNod{50%{transform:rotate(5deg) translateY(3px)}}
.watchwin{font-size:.82rem;font-weight:700;color:var(--coral);margin-bottom:14px}
.observe{list-style:none;padding:0;margin:15px 0 0}.observe li{color:var(--dim);padding-left:22px;position:relative;margin:8px 0}.observe li::before{content:"↳";position:absolute;left:0;color:var(--coral)}
.editionswitch{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);font-size:.75rem;color:var(--faint)}
.desktopnav{position:fixed;z-index:15;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.navbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.navbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:#11151e;border-radius:99px;padding:10px 16px;font-size:.8rem;font-weight:700;transition:.25s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading,.error{height:100svh;display:grid;place-items:center;text-align:center;color:var(--dim);padding:30px}
.loader{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
dialog{width:min(92vw,620px);max-height:min(82svh,760px);padding:0;color:var(--ink);background:#11151e;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(1,3,7,.76);backdrop-filter:blur(7px)}
.dialoghead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;background:linear-gradient(180deg,#11151e 75%,transparent)}
.dialoghead h2{font-family:'Fraunces',serif;font-size:1.7rem;margin:0}.dialogbody{padding:4px 12px 18px}
.editionbtn{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;padding:15px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;cursor:pointer;border-radius:14px}
.editionbtn:hover{background:rgba(255,255,255,.05)}
.editionbtn strong{font-family:'Fraunces',serif;font-size:1.08rem;font-weight:600}.editionbtn span{grid-column:1;color:var(--dim);font-size:.78rem}.editionbtn time{font-size:.75rem;color:var(--faint);align-self:center}
.editionbtn.active{background:rgba(242,189,73,.08)}
@media(max-width:700px){
  .pillbtn .labeltext{display:none}.pillbtn{width:38px;padding:0;justify-content:center}.desktopnav{display:none}
  .story{padding-left:22px;padding-right:22px}.storycard{width:100%}
  .story p{line-height:1.48}.hookcard h1{font-size:clamp(2.65rem,12vw,4.2rem)}
  .visualframe{border-radius:22px}.visualframe svg{max-height:46svh}
  .editionswitch{display:none}
}
@media(max-height:690px){
  .story{padding-top:calc(env(safe-area-inset-top) + 70px);padding-bottom:calc(env(safe-area-inset-bottom) + 26px)}
  .story h2{font-size:clamp(1.8rem,5vw,3.2rem);margin-bottom:18px}.story p{font-size:.96rem;line-height:1.42;margin-bottom:10px}
  .hookcard h1{font-size:clamp(2.4rem,10vw,4.8rem)}.hookcard .model{margin-top:18px}.eyebrow{margin-bottom:12px}
  .labbox{padding:20px}.stealline{font-size:clamp(2rem,6vw,4rem);margin-bottom:20px}.example{margin-top:14px;padding:13px 16px}.copybtn{margin-top:14px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.swipehint,.loader{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="ambient"></div>
<header class="topbar">
  <div class="toprow">
    <div class="brand">Daily<i>·</i>Insight</div>
    <div class="topactions">
      <button class="iconbtn" id="libraryBtn" type="button" aria-label="Open edition library" title="Edition library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </div>
  <div class="progress" id="progress" aria-label="Story progress"></div>
</header>
<main id="feed"><div class="loading"><div><div class="loader"></div>Loading today’s idea…</div></div></main>
<nav class="desktopnav" aria-label="Story navigation">
  <button class="navbtn" id="prevBtn" type="button" aria-label="Previous card"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"></path></svg></button>
  <button class="navbtn" id="nextBtn" type="button" aria-label="Next card"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></button>
</nav>
<dialog id="library">
  <div class="dialoghead"><h2>Edition library</h2><button class="iconbtn" id="closeLibrary" type="button" aria-label="Close library"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>
  <div class="dialogbody" id="editionList"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>{const d=document.createElement('div');d.textContent=t??'';return d.innerHTML};
const icons={
  copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>',
  down:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>'
};
let DATA=null,slides=[],current=0,observer=null,toastTimer=null;
const episodeTimers=new WeakMap();
const paragraphs=list=>(list||[]).map(p=>`<p>${p}</p>`).join('');

function story(ed,index,kind,body,label){
  return `<section class="story" data-edition="${esc(ed.date)}" data-edition-index="${index}" data-kind="${kind}" data-label="${esc(label)}" tabindex="-1">${body}<div class="editionswitch">${esc(ed.displayDate)}</div></section>`;
}

function buildEdition(ed,index){
  const result=[];
  const cardCount=4+(ed.insight.visualSvg?1:0)+(ed.masters?1:0)+(ed.shortVideo?1:0)+(ed.interactive?1:0);
  result.push(story(ed,index,'hook',`<div class="storycard hookcard">
    <div class="eyebrow" style="justify-content:center">${esc(ed.domain)}</div>
    <div class="date">${esc(ed.displayDate)}</div>
    <h1>${esc(ed.hook)}</h1>
    <div class="model">${esc(ed.insight.title)}</div>
    <div class="editioncount">A ${cardCount}-card idea</div>
  </div><div class="swipehint"><span>Swipe for the idea</span>${icons.down}</div>`,ed.insight.title));

  if(ed.shortVideo){
    result.push(story(ed,index,'shortvideo',`<div class="storycard" style="--accent:var(--gold)">
      <div class="eyebrow">Watch the short story</div>
      <div class="shortvideo-frame"><video class="shortvideo" src="${esc(ed.shortVideo.src)}" poster="${esc(ed.shortVideo.poster||'')}" playsinline muted loop controls preload="metadata" aria-label="${esc(ed.shortVideo.title)}"></video></div>
      <div class="shortvideo-meta"><span>${esc(ed.shortVideo.duration||'')}</span><span>Captions on · turn sound on for narration</span></div>
    </div>`,ed.shortVideo.title));
  }

  if(ed.interactive){
    result.push(story(ed,index,'interactive',`<div class="storycard" style="--accent:var(--teal)">
      <div class="eyebrow">Play the idea</div>
      <div class="episode-wrap">
        <div class="episode stage-intro" data-episode tabindex="0" aria-label="Interactive lesson: ${esc(ed.interactive.title)}">
          <div class="episode-sky"></div><div class="episode-sun"></div>
          <div class="episode-progress" aria-hidden="true"><span></span></div>
          <div class="episode-brand">Daily·Insight</div>
          <div class="episode-controls">
            <button class="episode-control" type="button" data-episode-sound aria-label="Turn sound effects on" title="Sound effects">
              <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"></path><path class="sound-wave" d="M17 9a4 4 0 0 1 0 6"></path></svg>
            </button>
            <button class="episode-control" type="button" data-episode-replay aria-label="Replay episode" title="Replay episode">
              <svg viewBox="0 0 24 24"><path d="M4 7v5h5"></path><path d="M6.5 17a8 8 0 1 0-.5-9.5L4 10"></path></svg>
            </button>
          </div>
          <svg viewBox="0 0 430 600" role="img" aria-label="Two people trying to make sense of a cluttered work update">
            <path d="M0 505H430" class="sketch" opacity=".18"/>
            <path d="M18 505Q70 470 122 505T226 505T330 505T434 505" fill="none" stroke="#8db5a1" stroke-width="12" opacity=".45"/>
            <g class="mess">
              <g class="mess-card" style="--scatter-x:-85px;--scatter-y:-62px;--scatter-r:-18deg"><rect x="72" y="105" width="98" height="62" rx="9" class="soft"/><path d="M88 125h58M88 140h38" class="sketch" stroke-width="3"/></g>
              <g class="mess-card" style="--scatter-x:105px;--scatter-y:-75px;--scatter-r:22deg"><rect x="225" y="82" width="104" height="72" rx="9" class="soft"/><circle cx="250" cy="116" r="10" class="coral"/><path d="M272 105h35M272 121h26" class="sketch" stroke-width="3"/></g>
              <g class="mess-card" style="--scatter-x:-100px;--scatter-y:45px;--scatter-r:25deg"><rect x="42" y="210" width="110" height="65" rx="9" class="soft"/><path d="M59 252l22-22 16 13 23-28" class="sketch" stroke-width="3"/></g>
              <g class="mess-card" style="--scatter-x:100px;--scatter-y:55px;--scatter-r:-24deg"><rect x="279" y="200" width="104" height="68" rx="9" class="soft"/><path d="M299 248v-22M319 248v-37M339 248v-16M359 248v-45" class="sketch" stroke-width="5"/></g>
            </g>
            <g class="timeline">
              <path class="timeline-path sketch" d="M55 238C120 175 180 285 228 218S325 145 378 202" stroke="#172029" stroke-width="7"/>
              <g class="beat" style="animation-delay:.35s"><circle cx="61" cy="234" r="26" class="coral"/><text x="61" y="239" text-anchor="middle" font-size="11" font-weight="800" class="ink">BEFORE</text></g>
              <g class="beat" style="animation-delay:.85s"><circle cx="226" cy="218" r="27" class="gold"/><text x="226" y="222" text-anchor="middle" font-size="11" font-weight="800" class="ink">CHANGE</text></g>
              <g class="beat" style="animation-delay:1.35s"><circle cx="375" cy="199" r="26" class="teal"/><text x="375" y="204" text-anchor="middle" font-size="11" font-weight="800" class="ink">AFTER</text></g>
            </g>
            <g transform="translate(112 330)"><g class="person person-a">
              <circle cx="0" cy="0" r="43" class="soft"/><path d="M-14 -8h9M6-8h9" class="sketch eyebrow" stroke-width="4"/><circle cx="-8" cy="-2" r="2.8" class="ink"/><circle cx="10" cy="-2" r="2.8" class="ink"/><path d="M-8 17q10 8 20 0" class="sketch" stroke-width="3"/><path d="M0 43v95M0 70l-48 28M0 70l48-24M0 138l-35 55M0 138l38 55" class="sketch"/><path d="M-21 47q21 20 42 0" fill="none" stroke="#f2bd49" stroke-width="12"/>
            </g></g>
            <g transform="translate(320 345)"><g class="person person-b">
              <circle cx="0" cy="0" r="39" class="soft"/><path d="M-13 -7h8M6-7h8" class="sketch eyebrow" stroke-width="4"/><circle cx="-8" cy="-1" r="2.6" class="ink"/><circle cx="9" cy="-1" r="2.6" class="ink"/><path d="M-9 16q9 -5 18 0" class="sketch listener-frown" stroke-width="3"/><path d="M-9 13q9 9 18 0" class="sketch listener-smile" stroke-width="3"/><path d="M0 39v91M0 66l-42 23M0 66l42 23M0 130l-32 57M0 130l34 57" class="sketch"/>
              <g class="confusion"><circle cx="55" cy="-44" r="24" fill="#fffaf0" stroke="#172029" stroke-width="3"/><text x="55" y="-35" text-anchor="middle" font-size="28" font-weight="800" class="ink">?</text></g>
            </g></g>
          </svg>
          <div class="episode-choice" data-episode-choice inert aria-hidden="true">
            <p>What would make this update land?</p>
            <button type="button" data-episode-answer="detail">Add more detail</button>
            <button type="button" data-episode-answer="change">Show the change</button>
          </div>
          <div class="episode-choice" data-episode-end inert aria-hidden="true">
            <p>Now make one of your updates move.</p>
            <button type="button" data-episode-replay>Replay the story</button>
            <button type="button" data-episode-continue>Try it yourself</button>
          </div>
          <div class="episode-caption" data-episode-caption aria-live="polite">Most work updates are accurate.</div>
        </div>
        <div class="episode-status">Interactive · captions on · optional sound effects</div>
      </div>
    </div>`,ed.interactive.title));
  }

  result.push(story(ed,index,'insight',`<div class="storycard" style="--accent:var(--teal)">
    <div class="eyebrow">The idea</div><h2>${esc(ed.insight.title)}</h2>${paragraphs(ed.insight.paras)}
    ${(ed.insight.after||[]).length?`<div class="after">${paragraphs(ed.insight.after)}</div>`:''}
  </div>`,`${ed.insight.title}: the idea`));

  if(ed.insight.visualSvg){
    result.push(story(ed,index,'visual',`<div class="storycard" style="--accent:var(--violet)">
      <div class="eyebrow">See the model</div><div class="visualframe">${ed.insight.visualSvg}</div>
      ${ed.insight.visualCaption?`<div class="caption">${esc(ed.insight.visualCaption)}</div>`:''}
    </div>`,`${ed.insight.title}: visual model`));
  }

  result.push(story(ed,index,'lab',`<div class="storycard" style="--accent:var(--violet)">
    <div class="eyebrow">Try it now</div><h2>${esc(ed.lab.title)}</h2>${paragraphs(ed.lab.paras)}
    <div class="labbox"><div class="label">Under five minutes</div><p class="exercise">${ed.lab.exercise}</p></div>
  </div>`,`${ed.lab.title}: practice`));

  if(ed.masters){
    const start=ed.masters.start?`?start=${encodeURIComponent(ed.masters.start)}`:'';
    result.push(story(ed,index,'video',`<div class="storycard" style="--accent:var(--coral)">
      <div class="eyebrow">Watch it happen</div><h2>${esc(ed.masters.name)}</h2><p><strong>${esc(ed.masters.talk)}</strong></p>
      <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(ed.masters.videoId)}${start}" title="${esc(ed.masters.talk)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      ${ed.masters.watchWindow?`<div class="watchwin">Watch ${esc(ed.masters.watchWindow)}</div>`:''}${paragraphs(ed.masters.paras)}
      <ul class="observe">${(ed.masters.observe||[]).map(o=>`<li>${esc(o)}</li>`).join('')}</ul>
    </div>`,`${ed.masters.name}: watch the idea`));
  }

  const example=(ed.steal.example||[]).map(l=>`<p>“${esc(l)}”</p>`).join('');
  result.push(story(ed,index,'steal',`<div class="storycard" style="--accent:var(--gold)">
    <div class="eyebrow">Keep this line</div><div class="stealline">${esc(ed.steal.line)}</div>${paragraphs(ed.steal.paras)}
    ${example?`<div class="example">${example}</div>`:''}
    <button class="copybtn" type="button" data-copy="${encodeURIComponent(ed.steal.line)}">${icons.copy}<span>Copy the line</span></button>
  </div>`,`${ed.insight.title}: line to steal`));
  return result;
}

function render(){
  const all=[];
  DATA.editions.forEach((ed,i)=>all.push(...buildEdition(ed,i)));
  $('#feed').innerHTML=all.join('');
  slides=[...document.querySelectorAll('.story')];
  renderLibrary();
  bindSlides();
  updateUI(0);
}

function renderLibrary(){
  $('#editionList').innerHTML=DATA.editions.map((ed,i)=>`<button class="editionbtn ${i===0?'active':''}" type="button" data-date="${esc(ed.date)}">
    <strong>${esc(ed.insight.title)}</strong><time>${esc(ed.displayDate)}</time><span>${esc(ed.domain)} · ${esc(ed.hook)}</span>
  </button>`).join('');
}

function bindSlides(){
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    const idx=slides.indexOf(visible.target);
    if(idx>=0&&idx!==current){current=idx;updateUI(idx)}
  },{threshold:[.52,.7,.9]});
  slides.forEach(s=>observer.observe(s));
  document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',()=>copy(decodeURIComponent(btn.dataset.copy))));
  bindEpisodes();
}

function currentEditionSlides(){
  const date=slides[current]?.dataset.edition;
  return slides.filter(s=>s.dataset.edition===date);
}

function updateUI(idx){
  const slide=slides[idx];if(!slide)return;
  const group=currentEditionSlides();
  const local=group.indexOf(slide);
  $('#progress').innerHTML=group.map((_,i)=>`<span class="${i<local?'done':i===local?'active':''}" aria-hidden="true"></span>`).join('');
  $('#progress').setAttribute('aria-label',`Card ${local+1} of ${group.length}`);
  document.querySelectorAll('.editionbtn').forEach(b=>b.classList.toggle('active',b.dataset.date===slide.dataset.edition));
  document.querySelectorAll('.shortvideo').forEach(video=>{
    if(slide.contains(video))video.play().catch(()=>{});else video.pause();
  });
  document.querySelectorAll('[data-episode]').forEach(episode=>{
    if(slide.contains(episode))startEpisode(episode);else stopEpisode(episode);
  });
  document.title=`${slide.dataset.label} · Daily Insight`;
}

function move(delta){
  const nearest=slides.reduce((best,slide,index)=>{
    const distance=Math.abs(slide.getBoundingClientRect().top);
    return distance<best.distance?{index,distance}:best;
  },{index:current,distance:Infinity}).index;
  const next=Math.max(0,Math.min(slides.length-1,nearest+delta));
  slides[next]?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}

function goToEdition(date,kind){
  const slide=slides.find(s=>s.dataset.edition===date&&(!kind||s.dataset.kind===kind))||slides.find(s=>s.dataset.edition===date);
  if(slide){
    document.documentElement.style.scrollBehavior='auto';
    slide.scrollIntoView({block:'start'});
    requestAnimationFrame(()=>document.documentElement.style.scrollBehavior='');
  }
  if($('#library').open)$('#library').close();
}

async function copy(text){
  try{await navigator.clipboard.writeText(text);showToast('Copied — try it today')}catch{showToast('Select and copy the line')}
}

function showToast(message){
  const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

function bindEpisodes(){
  document.querySelectorAll('[data-episode]').forEach(episode=>{
    episode.querySelectorAll('[data-episode-replay]').forEach(button=>button.addEventListener('click',()=>startEpisode(episode,true)));
    episode.querySelectorAll('[data-episode-answer]').forEach(button=>button.addEventListener('click',()=>chooseEpisodePath(episode,button.dataset.episodeAnswer)));
    episode.querySelector('[data-episode-continue]')?.addEventListener('click',()=>move(1));
    episode.querySelector('[data-episode-sound]')?.addEventListener('click',event=>{
      episode.dataset.sound=episode.dataset.sound==='on'?'off':'on';
      const on=episode.dataset.sound==='on';event.currentTarget.classList.toggle('on',on);
      event.currentTarget.setAttribute('aria-label',on?'Turn sound effects off':'Turn sound effects on');
      if(on)episodeTone(episode,520,.07,.12);
      showToast(on?'Sound effects on':'Sound effects off');
    });
  });
}

function episodeSchedule(episode,callback,delay){
  const timers=episodeTimers.get(episode)||[];
  timers.push(setTimeout(callback,delay));episodeTimers.set(episode,timers);
}

function stopEpisode(episode){
  (episodeTimers.get(episode)||[]).forEach(clearTimeout);episodeTimers.set(episode,[]);episode.dataset.running='off';
}

function setEpisode(episode,{stage,caption,progress}){
  if(stage){episode.classList.remove('stage-intro','stage-choice','stage-wrong','stage-right');episode.classList.add(`stage-${stage}`)}
  if(caption)episode.querySelector('[data-episode-caption]').textContent=caption;
  if(progress!=null)episode.querySelector('.episode-progress span').style.width=`${progress}%`;
}

function toggleEpisodePanel(panel,show){
  panel.classList.toggle('show',show);panel.toggleAttribute('inert',!show);panel.setAttribute('aria-hidden',show?'false':'true');
}

function startEpisode(episode,force=false){
  if(episode.dataset.running==='yes'&&!force)return;
  stopEpisode(episode);episode.dataset.running='yes';
  toggleEpisodePanel(episode.querySelector('[data-episode-choice]'),false);
  toggleEpisodePanel(episode.querySelector('[data-episode-end]'),false);
  setEpisode(episode,{stage:'intro',caption:'Most work updates are accurate.',progress:10});
  episodeSchedule(episode,()=>{setEpisode(episode,{caption:'And instantly forgettable.',progress:23});episodeTone(episode,220,.05,.09)},1850);
  episodeSchedule(episode,()=>{setEpisode(episode,{caption:'The facts are there. The movement isn’t.',progress:35})},3600);
  episodeSchedule(episode,()=>{
    setEpisode(episode,{stage:'choice',caption:'You have ten seconds. What would make this land?',progress:43});
    episode.querySelector('[data-episode-choice] p').textContent='What would make this update land?';
    toggleEpisodePanel(episode.querySelector('[data-episode-choice]'),true);
    episode.dataset.running='choice';episodeTone(episode,420,.08,.11);
  },5350);
}

function chooseEpisodePath(episode,answer){
  if(episode.dataset.running!=='choice')return;
  stopEpisode(episode);toggleEpisodePanel(episode.querySelector('[data-episode-choice]'),false);
  if(answer==='detail'){
    episode.dataset.running='wrong';setEpisode(episode,{stage:'wrong',caption:'More detail adds weight—not motion.',progress:60});episodeTone(episode,145,.13,.18);
    episodeSchedule(episode,()=>{setEpisode(episode,{caption:'Try the move that lets people see the change.',progress:68});episode.querySelector('[data-episode-choice] p').textContent='Try a different move.';toggleEpisodePanel(episode.querySelector('[data-episode-choice]'),true);episode.dataset.running='choice'},2200);
    return;
  }
  episode.dataset.running='right';setEpisode(episode,{stage:'right',caption:'Before: handoffs kept disappearing.',progress:58});episodeTone(episode,330,.06,.1);
  episodeSchedule(episode,()=>{setEpisode(episode,{caption:'Change: put every handoff on one shared timeline.',progress:70});episodeTone(episode,440,.06,.1)},1500);
  episodeSchedule(episode,()=>{setEpisode(episode,{caption:'After: blockers became visible.',progress:82});episodeTone(episode,550,.07,.12)},3100);
  episodeSchedule(episode,()=>{setEpisode(episode,{caption:'Three beats. One story people can repeat.',progress:100});episodeTone(episode,660,.08,.15)},4700);
  episodeSchedule(episode,()=>{toggleEpisodePanel(episode.querySelector('[data-episode-end]'),true);episode.dataset.running='done'},6100);
}

function episodeTone(episode,frequency,duration,volume){
  if(episode.dataset.sound!=='on')return;
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;const ctx=new AudioCtx();
    const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;
    gain.gain.setValueAtTime(volume,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
    osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);osc.onended=()=>ctx.close();
  }catch{}
}

$('#libraryBtn').addEventListener('click',()=>{$('#library').showModal();setTimeout(()=>$('#library .editionbtn.active')?.scrollIntoView({block:'center'}),0)});
$('#closeLibrary').addEventListener('click',()=>$('#library').close());
$('#library').addEventListener('click',e=>{if(e.target===$('#library'))$('#library').close()});
$('#editionList').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b)goToEdition(b.dataset.date)});
$('#prevBtn').addEventListener('click',()=>move(-1));$('#nextBtn').addEventListener('click',()=>move(1));
document.addEventListener('keydown',e=>{
  if($('#library').open)return;
  if(e.target.closest('button,input,textarea,select'))return;
  if(['ArrowDown','PageDown','j','J',' '].includes(e.key)){e.preventDefault();move(1)}
  if(['ArrowUp','PageUp','k','K'].includes(e.key)){e.preventDefault();move(-1)}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){document.querySelectorAll('.shortvideo').forEach(video=>video.pause());document.querySelectorAll('[data-episode]').forEach(stopEpisode)}
  else slides[current]?.querySelectorAll('[data-episode]').forEach(episode=>startEpisode(episode,true));
});

fetch('editions.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{
  if(!data.editions?.length)throw new Error();DATA=data;render();
  const params=new URLSearchParams(location.search),edition=params.get('edition'),card=params.get('card');
  if(edition)requestAnimationFrame(()=>goToEdition(edition,card));
}).catch(()=>{$('#feed').innerHTML='<div class="error"><div><strong>Today’s idea couldn’t load.</strong><br>Refresh and try again.</div></div>'});
</script>
</body>
</html>
