name: Daily Edition

on:
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:
    inputs:
      edition_date:
        description: "Optional edition date (YYYY-MM-DD); blank uses today in New York"
        required: false
        default: ""
        type: string
      smoke_test:
        description: "Test the OpenAI key without publishing a new edition"
        required: false
        default: false
        type: boolean
      connection_test:
        description: "Verify the Higgsfield key without spending generation funds"
        required: false
        default: false
        type: boolean
      resume_video:
        description: "Resume assembly from six existing paid request IDs; never submit new video generation"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          pip install openai requests numpy soundfile kokoro
      - name: Generate today's edition
        if: ${{ inputs.connection_test != true && inputs.resume_video != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WRITER_MODEL: ${{ vars.OPENAI_WRITER_MODEL || 'gpt-6-luna' }}
          OPENAI_WRITER_REASONING_EFFORT: ${{ vars.OPENAI_WRITER_REASONING_EFFORT || 'medium' }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6.1-sol' }}
          OPENAI_REVIEW_REASONING_EFFORT: ${{ vars.OPENAI_REVIEW_REASONING_EFFORT || 'medium' }}
          OPENAI_WRITER_MAX_OUTPUT_TOKENS: "20000"
          OPENAI_REVIEW_MAX_OUTPUT_TOKENS: "20000"
          EDITION_INTERVAL_DAYS: ${{ vars.EDITION_INTERVAL_DAYS || '2' }}
          EDITION_ANCHOR_DATE: ${{ vars.EDITION_ANCHOR_DATE || '2026-07-27' }}
          EDITION_DATE: ${{ inputs.edition_date || '' }}
          VIDEO_PILOT_ENABLED: ${{ vars.VIDEO_PILOT_ENABLED || '0' }}
          SMOKE_TEST: ${{ inputs.smoke_test && '1' || '0' }}
        run: python scripts/generate_edition.py
      - name: Generate a full story video after the script passes review
        if: ${{ vars.VIDEO_PILOT_ENABLED == '1' && inputs.connection_test != true && inputs.resume_video != true && inputs.smoke_test != true }}
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
          HF_MAX_RATE_USD_PER_SECOND: "0.065"
          HF_MAX_VIDEO_COST_USD: "7.80"
          HF_PILOT_MAX_COST_USD: "30.00"
        run: python scripts/generate_higgsfield_video.py
      - name: Resume final assembly from existing completed requests
        if: ${{ inputs.resume_video == true }}
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
          HF_MAX_RATE_USD_PER_SECOND: "0.065"
          HF_MAX_VIDEO_COST_USD: "7.80"
          HF_PILOT_MAX_COST_USD: "30.00"
        run: python scripts/generate_higgsfield_video.py --resume-only
      - name: Verify Higgsfield connection without paid generation
        if: ${{ inputs.connection_test == true }}
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
        run: python scripts/generate_higgsfield_video.py --connection-test
      - name: Commit and push
        if: ${{ always() }}
        run: |
          git config user.name "daily-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add editions.json assets/videos
          git diff --cached --quiet || git commit -m "Edition $(date -u +%F)"
          git push
